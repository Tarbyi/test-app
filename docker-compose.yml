services:
  app:
    build:
      context: .
      additional_contexts:
        sysconf: /etc
      dockerfile_inline: |
        FROM alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
        COPY --from=sysconf hostname /evidence/hostname
        RUN sha256sum /evidence/hostname
    ports:
      - "8080:8080"
    command:
      - sh
      - -c
      - exec busybox httpd -f -p 8080 -h /tmp
